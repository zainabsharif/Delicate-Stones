<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Store Owner — DelicateStones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="module" src="./assets/js/admin.js"></script>
<style>
  :root{
    --ink:#17140f;
    --ink-dark:#0f0c07;
    --ivory:#f6efe2;
    --ivory-soft:#f2e7d5;
    --card:#fffbf3;
    --gold:#b6893c;
    --gold-light:#e2c88f;
    --teal:#4c6a63;
    --blush:#d9b7a1;
    --line: rgba(23,20,15,0.12);
    --gold-dark:#8a6a2e;
    --maxw: 1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ font-size:106%; }
  body{ background:var(--ivory); color:var(--ink); font-family:'Jost', sans-serif; font-weight:300; line-height:1.55; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4{ font-family:'Cormorant Garamond', serif; font-weight:500; color:var(--ink-dark); }
  a{ color:inherit; }
  img{ display:block; max-width:100%; }
  button{ font-family:inherit; cursor:pointer; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  @media (max-width:560px){ .wrap{ padding:0 16px; } }

  .btn{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    padding:9px 18px; border-radius:999px; font-size:0.88rem; letter-spacing:0.04em;
    border:1px solid var(--ink); background:transparent; color:var(--ink); transition:all 0.2s ease;
  }
  .btn-solid{ background:var(--ink); color:var(--ivory); }
  .btn-solid:hover{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
  .btn-ghost:hover{ background:var(--ink); color:var(--ivory); }
  .btn-danger{ border-color:#a2412c; color:#a2412c; }
  .btn-danger:hover{ background:#a2412c; color:#fff; }

  header{ background:rgba(230,220,200,0.9); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:14px; padding-bottom:14px; }
  .logo{ display:flex; align-items:center; gap:12px; text-decoration:none; }
  .logo img{ width:40px; height:40px; border-radius:50%; object-fit:cover; }
  .logo .brand{ font-family:'Cormorant Garamond', serif; font-size:1.45rem; letter-spacing:0.04em; }
  .logo .brand em{ font-style:normal; color:var(--gold); }
  .logo .role{ font-size:0.7rem; letter-spacing:0.22em; text-transform:uppercase; color:#4a453b; }
  .who{ display:flex; align-items:center; gap:12px; font-size:0.85rem; color:#5a5347; min-width:0; }
  .who span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:560px){ .who span{ display:none; } }

  main{ padding:32px 0 80px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:24px; }
  .login{ max-width:400px; margin:48px auto; }
  .login h2{ font-size:1.9rem; margin-bottom:6px; }
  .notice{ max-width:640px; margin:48px auto; }
  .notice h2{ font-size:1.8rem; margin-bottom:10px; }
  .notice p{ margin-bottom:10px; }
  .notice code{ background:var(--ivory-soft); padding:2px 6px; border-radius:3px; font-size:0.9em; word-break:break-all; }

  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:24px; overflow-x:auto; }
  .tabs button{
    background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px;
    font-size:1rem; color:#5a5347; white-space:nowrap;
  }
  .tabs button.active{ color:var(--ink-dark); border-bottom-color:var(--gold); font-weight:400; }
  .tab-count{ font-size:0.75rem; background:var(--ink); color:var(--gold-light); border-radius:999px; padding:1px 7px; margin-left:4px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chips button{
    border:1px solid var(--line); background:#fffdf8; border-radius:999px; padding:6px 14px;
    font-size:0.85rem; color:#4a453b;
  }
  .chips button.active{ background:var(--gold); border-color:var(--gold); color:var(--ink); }

  .orders{ display:grid; gap:16px; }
  .order{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:18px 20px; display:grid; gap:12px; }
  .order-head{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 16px; align-items:baseline; }
  .order-code{ font-family:'Cormorant Garamond', serif; font-size:1.4rem; font-weight:600; }
  .order-date{ font-size:0.85rem; color:#77705f; margin-left:8px; font-family:'Jost', sans-serif; font-weight:300; }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; }
  .badge{ font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; padding:3px 10px; border-radius:999px; border:1px solid transparent; }
  .b-pending{ background:#fbecc9; color:#7a5a12; }
  .b-confirmed{ background:#dde9f3; color:#29506e; }
  .b-delivered{ background:#dcebe4; color:#2f5a4a; }
  .b-cancelled{ background:#eee; color:#777; }
  .b-paid{ background:#dcebe4; color:#2f5a4a; }
  .b-unpaid{ background:#f7e1dc; color:#7a2e1f; }
  .b-method{ border-color:var(--line); color:#4a453b; }
  .order-grid{ display:grid; grid-template-columns:1fr 1.2fr; gap:16px 28px; }
  @media (max-width:760px){ .order-grid{ grid-template-columns:1fr; } }
  .order-cust{ font-size:0.95rem; display:grid; gap:2px; }
  .order-cust a{ color:var(--teal); }
  .order-notes{ font-size:0.88rem; color:#5a5347; font-style:italic; margin-top:6px; white-space:pre-line; }
  .order-items{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  .order-items td{ padding:4px 0; border-bottom:1px dashed var(--line); vertical-align:top; }
  .order-items td:last-child{ text-align:right; white-space:nowrap; }
  .order-items tr.total td{ border-bottom:none; font-weight:500; padding-top:8px; }
  .warn{ font-size:0.78rem; color:#a2412c; display:block; }
  .order-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  .empty{ text-align:center; color:#77705f; padding:40px 0; }

  .prod-layout{ display:grid; grid-template-columns:360px 1fr; gap:28px; align-items:start; }
  @media (max-width:900px){ .prod-layout{ grid-template-columns:1fr; } }
  .prod-form{ position:sticky; top:90px; max-height:calc(100vh - 110px); overflow-y:auto; }
  @media (max-width:900px){ .prod-form{ position:static; max-height:none; } }
  .prod-form h3{ font-size:1.5rem; margin-bottom:4px; }
  .img-preview{ width:140px; aspect-ratio:1/1; object-fit:cover; border-radius:4px; border:1px solid var(--line); background:var(--ivory-soft); }
  .check{ display:flex !important; align-items:center; gap:8px; grid-template-columns:none !important; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .import-banner{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; background:#fbecc9; border:1px solid #efd9a0; border-radius:6px; padding:14px 18px; font-size:0.92rem; }
  .prod-toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:12px; font-size:0.88rem; color:#5a5347; }
  .prod-toolbar input{ font:inherit; padding:7px 12px; border:1px solid rgba(23,20,15,0.2); border-radius:999px; background:#fffdf8; min-width:220px; }
  .prod-list{ display:grid; gap:10px; }
  .prod-row{ display:grid; grid-template-columns:56px 1fr 130px auto; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:10px 14px; }
  .prod-row.hidden-prod{ opacity:0.55; }
  .prod-row img{ width:56px; height:56px; object-fit:cover; border-radius:4px; }
  .prod-name{ font-weight:400; line-height:1.3; }
  .prod-cat{ font-size:0.8rem; color:#77705f; }
  .price-edit{ display:flex; align-items:center; gap:6px; font-size:0.85rem; }
  .price-edit input{ width:92px; font:inherit; padding:6px 8px; border:1px solid rgba(23,20,15,0.2); border-radius:4px; background:#fffdf8; }
  .price-edit input.need{ border-color:#d99a2b; background:#fff6e2; }
  .saved{ font-size:0.75rem; color:var(--teal); }
  .prod-btns{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .prod-btns .btn{ padding:6px 12px; font-size:0.78rem; }
  @media (max-width:640px){
    .prod-row{ grid-template-columns:56px 1fr; }
    .price-edit, .prod-btns{ grid-column:1 / -1; justify-content:flex-start; }
  }

  .rev-list{ display:grid; gap:12px; }
  .rev{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 18px; display:flex; gap:16px; justify-content:space-between; align-items:flex-start; }
  .rev p{ font-style:italic; margin:4px 0; }
  .rev-meta{ font-size:0.82rem; color:#77705f; }
</style>
<link rel="stylesheet" href="./assets/css/shop.css">
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">
      <img src="./assets/logo.jpg" alt="DelicateStones logo">
      <div>
        <div class="brand">Delicate<em>Stones</em></div>
        <div class="role">Store owner</div>
      </div>
    </a>
    <div class="who" id="who" hidden>
      <span id="whoEmail"></span>
      <button type="button" class="btn btn-ghost" id="signOutBtn">Sign out</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="app">
    <p class="empty">Loading…</p>
  </div>
</main>

</body>
</html>
